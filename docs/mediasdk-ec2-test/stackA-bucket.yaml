AWSTemplateFormatVersion: '2010-09-09'
Description: TEMPORARY private bucket for the isolated Insta360 MediaSDK CPU compatibility test. Delete after the test.
Resources:
  TestBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-after-one-day
            Status: Enabled
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - { Key: Name, Value: sv-mediasdk-test-bucket }
        - { Key: Project, Value: sitevision-mediasdk-compat-test }
        - { Key: Temporary, Value: 'true' }
  TestBucketTlsOnly:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TestBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt TestBucket.Arn
              - !Sub '${TestBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
Outputs:
  BucketName:
    Value: !Ref TestBucket
