AWSTemplateFormatVersion: '2010-09-09'
Description: SiteVision MediaSDK stitch worker ECR repository, configured like the sitevision-backend repository. The proprietary SDK is never pushed here; only the open application and OS layers.

Resources:
  StitchWorkerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: sitevision-stitch-worker
      ImageTagMutability: IMMUTABLE_WITH_EXCLUSION
      ImageTagMutabilityExclusionFilters:
        - ImageTagMutabilityExclusionFilterType: WILDCARD
          ImageTagMutabilityExclusionFilterValue: latest
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the newest 15 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":15},"action":{"type":"expire"}}]}'
      Tags:
        - Key: Project
          Value: SiteVision
        - Key: Environment
          Value: prod

Outputs:
  StitchWorkerRepositoryUri:
    Value: !GetAtt StitchWorkerRepository.RepositoryUri
