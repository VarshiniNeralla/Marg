AWSTemplateFormatVersion: '2010-09-09'
Description: Dedicated KMS key for the SiteVision production secrets in AWS Secrets Manager

Parameters:
  AdminPrincipalArn:
    Type: String
    Default: arn:aws:iam::196338354246:user/MHC_User2
    Description: The IAM principal that writes the secret (needs to encrypt when it stores a new version)
  AppRoleArn:
    Type: String
    Default: arn:aws:iam::196338354246:role/SiteVisionEC2Role
    Description: The EC2 role that reads the secret at run time

Resources:
  SecretsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts the SiteVision production secrets in AWS Secrets Manager
      Enabled: true
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountRootKeepsAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: SecretWriterThroughSecretsManagerOnly
            Effect: Allow
            Principal:
              AWS: !Ref AdminPrincipalArn
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
              - kms:DescribeKey
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
          - Sid: AppRoleReadsThroughSecretsManagerOnly
            Effect: Allow
            Principal:
              AWS: !Ref AppRoleArn
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
      Tags:
        - Key: Project
          Value: SiteVision
        - Key: Environment
          Value: prod

  SecretsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/sitevision-secrets
      TargetKeyId: !Ref SecretsKey

Outputs:
  KeyArn:
    Value: !GetAtt SecretsKey.Arn
  KeyAlias:
    Value: alias/sitevision-secrets
